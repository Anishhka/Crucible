# Fully-resolved conda environment for linux-64 (CONTRACT.md §11).
#
# Regenerate after any change to environment.yml:
#
#     docker run --rm -v "$PWD:/w" -w /w condaforge/miniforge3 \
#       bash -lc "conda env create -q -f environment.yml -n crucible \
#                 && conda env export -n crucible --no-builds > environment.lock.yml"
#
# Every entry is version-exact. The solver is not free to pick a different
# version tomorrow, which is the whole point of committing this file.
name: crucible
channels:
  - conda-forge
  - nodefaults
dependencies:
  - _libgcc_mutex=0.1
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2024.8.30
  - ld_impl_linux-64=2.43
  - libexpat=2.6.3
  - libffi=3.4.2
  - libgcc=14.1.0
  - libgcc-ng=14.1.0
  - libgomp=14.1.0
  - libnsl=2.0.1
  - libsqlite=3.46.1
  - libuuid=2.38.1
  - libxcrypt=4.4.36
  - libzlib=1.3.1
  - ncurses=6.5
  - openssl=3.3.2
  - pip=24.0
  - python=3.11.9
  - readline=8.2
  - setuptools=73.0.1
  - tk=8.6.13
  - tzdata=2024a
  - wheel=0.44.0
  - xz=5.2.6
  - pip:
      - attrs==24.2.0
      - jsonschema==4.23.0
      - jsonschema-specifications==2023.12.1
      - referencing==0.35.1
      - rpds-py==0.20.0
